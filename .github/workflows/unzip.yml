name: Unzip upload
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into the repo
        run: |
          unzip -q nazara-tv-github.zip -x 'nazara-tv-repo/.github/*' -d tmp
          cp -r tmp/nazara-tv-repo/. .
          rm -rf tmp nazara-tv-github.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add Nazara TV files"
          git push
