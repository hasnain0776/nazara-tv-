name: Build Nazara TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the app
        run: |
          test -f nazara-app.zip
          mkdir app
          unzip -q nazara-app.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        working-directory: app
        run: |
          npx cap add android
          npx capacitor-assets generate --android --splashBackgroundColor '#0d0f14' --splashBackgroundColorDark '#0d0f14'
          python3 tools/patch_android.py
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Nazara-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nazara-TV-APK
          path: Nazara-TV.apk

      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nazara TV 1.0.${{ github.run_number }}
          files: Nazara-TV.apk
